services:
  earth-sensors-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: earth-sensors-website:${IMAGE_TAG:-latest}
    container_name: earth-sensors-website
    restart: unless-stopped
    read_only: true
    # The unprivileged image keeps every writable path under /tmp.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.earth-sensors.rule=Host(`earth-sensors.jeffemmett.com`)"
      - "traefik.http.routers.earth-sensors.entrypoints=web"
      - "traefik.http.services.earth-sensors.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
