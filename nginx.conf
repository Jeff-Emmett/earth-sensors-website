server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No secrets, no user data, no cookies. Lock the page down anyway.
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    # Google Fonts is the only third party. Everything else is same-origin.
    # style-src-attr allows the one data-driven style attribute (a bar width in
    # app.js); style-src itself stays strict, so an injected <style> is blocked.
    add_header Content-Security-Policy  "default-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 512;

    location ~* \.(css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
